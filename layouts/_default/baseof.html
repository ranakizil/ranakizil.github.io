<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  
  {{ partial "docs/html-head" . }}

  <!-- 1. Import Editorial Serif Fonts (Newsreader) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- 2. MathJax Script -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- 3. Classy Stylesheet -->
  <style>
    :root {
      --bg-color: #fcfcfc;
      --text-color: #242424;
      --muted-color: #6b6b6b;
      --accent-color: #1a1a1a;
      --border-color: #e5e5e5;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

      .site-wrapper {
      max-width: 960px; /* Expands reading width to the left and right */
      width: 90%;       /* Keeps comfortable padding on smaller screens */
      margin: 0 auto;
      padding: 3.5rem 0;
    }

    /* Classy Header */
    .site-header {
      margin-bottom: 3.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .site-header a {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 2.1rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--accent-color);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .site-header a:hover {
      opacity: 0.7;
    }

    /* Article Titles & Post Feed Styling */
    .site-content h1, 
    .site-content h2, 
    .site-content .book-post-title {
      font-family: 'Newsreader', Georgia, serif;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .site-content a {
      color: var(--accent-color);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .site-content a:hover {
      color: #000;
      text-decoration: underline;
    }

    /* Paragraph Body Reading Experience */
    .site-content p, 
    .markdown p {
      font-size: 1.05rem;
      line-height: 1.75;
      color: #2b2b2b;
      margin-bottom: 1.5rem;
    }
    /* Image Sizing Classes */
    .img-small {
      max-width: 300px !important;
      width: 100% !important;
      height: auto !important;
      display: block;
      margin: 1.5rem 0;
    }
    
    .img-medium {
      max-width: 500px !important;
      width: 100% !important;
      height: auto !important;
      display: block;
      margin: 1.5rem 0;
    }

    /* Metadata / Dates */
    .book-post-meta,
    time {
      font-size: 0.875rem;
      color: var(--muted-color);
      font-weight: 400;
    }

    /* Math Formula Display Enhancements */
    .mjx-chtml {
      font-size: 110% !important;
      color: #111;
    }
  </style>
</head>

<body>
  <div class="site-wrapper">
    <header class="site-header">
      <a href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
    </header>

    <main class="site-content">
      {{ block "main" . }}{{ end }}
    </main>
  </div>
</body>
</html>
