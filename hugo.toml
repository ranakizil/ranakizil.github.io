baseURL = 'https://ranakizil.github.io/'
languageCode = 'en-us'
title = "rana's blog"
theme = 'hugo-book'

# Disable Categories and Tags pages/widgets completely
disableKinds = ["taxonomy", "term"]

[params]
  BookTitle = "rana's blog"
  BookSearch = false
  BookToC = false
  BookTheme = 'light'
  BookCustomCSS = ["custom.css"]
  math = true

# Enable raw LaTeX passthrough for Goldmark parser
[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$']]
          inline = [['$', '$']]
