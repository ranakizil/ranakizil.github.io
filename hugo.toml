baseURL = 'https://ranakizil.github.io/'
languageCode = 'en-us'
title = "rana's blog"
theme = 'hugo-book'

[params]
  # The name that appears at the top
  BookTitle = "rana's blog"
  
  # Clean ChatGPT look: No search, no right-side table of contents
  BookSearch = false
  BookToC = false
  BookTheme = 'light'

  # Important: Points Hugo to your custom styles
  customCSS = ["css/custom.css"]

  # Optional: Links for your sidebar
  BookRepo = 'https://github.com/ranakizil/ranakizil.github.io'