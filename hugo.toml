baseURL = 'https://ranakizil.github.io/'
languageCode = 'en-us'
title = "rana's blog"
theme = 'hugo-book'

[params]
  BookTitle = "rana's blog"
  # This makes the content take up more space
  BookSectionEnumerable = true
  # This moves the menu to the top on mobile, but for desktop we 
  # can toggle the 'Table of Contents' to the left or right
  BookToC = true
  customCSS = ["css/custom.css"]